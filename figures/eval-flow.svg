<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c1a0e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f5f0e8"/>

  <!-- Source Identity -->
  <rect x="60" y="180" width="180" height="100" rx="12" fill="#fff" stroke="#6b1414" stroke-width="2"/>
  <text x="150" y="215" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2c1a0e" text-anchor="middle">Source Identity</text>
  <text x="150" y="245" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#7a5c3a" text-anchor="middle">photo + voice + style</text>

  <!-- Distribution point -->
  <circle cx="270" cy="230" r="4" fill="#6b1414"/>

  <!-- Arrows from source to distribution, then to touches -->
  <line x1="240" y1="230" x2="270" y2="230" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="270,230 270,115 290,115" fill="none" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="270,230 270,230 290,230" fill="none" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="270,230 270,345 290,345" fill="none" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Touchpoints -->
  <rect x="300" y="70" width="150" height="80" rx="10" fill="#fff" stroke="#6b1414" stroke-width="2"/>
  <text x="375" y="115" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2c1a0e" text-anchor="middle">Touch 1</text>

  <rect x="300" y="190" width="150" height="80" rx="10" fill="#fff" stroke="#6b1414" stroke-width="2"/>
  <text x="375" y="235" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2c1a0e" text-anchor="middle">Touch 2</text>

  <rect x="300" y="310" width="150" height="80" rx="10" fill="#fff" stroke="#6b1414" stroke-width="2"/>
  <text x="375" y="355" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#2c1a0e" text-anchor="middle">Touch 3</text>

  <!-- Arrows from touches to compare -->
  <line x1="450" y1="110" x2="540" y2="205" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="230" x2="540" y2="230" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="350" x2="540" y2="255" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compare diamond -->
  <polygon points="600,130 700,230 600,330 500,230" fill="#fff" stroke="#6b1414" stroke-width="2"/>
  <text x="600" y="215" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2c1a0e" text-anchor="middle">Sequence Persistence</text>
  <text x="600" y="235" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2c1a0e" text-anchor="middle">Check</text>
  <text x="600" y="255" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#7a5c3a" text-anchor="middle">measure face &amp; style</text>

  <!-- Arrows from compare to results -->
  <polyline points="700,190 760,160 870,160" fill="none" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="700,270 760,300 870,300" fill="none" stroke="#2c1a0e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pass -->
  <rect x="880" y="120" width="140" height="80" rx="10" fill="#7a8c5a" stroke="#5a6b44" stroke-width="2"/>
  <text x="950" y="165" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Pass</text>

  <!-- Fail -->
  <rect x="880" y="260" width="140" height="80" rx="10" fill="#6b1414" stroke="#6b1414" stroke-width="2"/>
  <text x="950" y="290" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Identity</text>
  <text x="950" y="315" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Drift</text>

  <!-- Labels -->
  <text x="820" y="145" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#7a5c3a" text-anchor="middle">Consistent</text>
  <text x="820" y="330" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#7a5c3a" text-anchor="middle">Drift detected</text>
</svg>
